name: Publish final release description
on:
  push:
    branches: ['release/v1.0.33-refresh']
permissions:
  contents: read
jobs:
  description:
    if: github.repository == 'umirr/NAIS3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.33 --repo "$GITHUB_REPOSITORY" --notes-file release-notes/v1.0.33.md
