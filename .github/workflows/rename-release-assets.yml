name: Rename release assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-fork-release
  cancel-in-progress: false

jobs:
  rename:
    if: github.repository == 'umirr/NAIS3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rename installer and update download paths
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.33
          OLD_NAME: nais3-1.0.33-setup.exe
          NEW_NAME: nais3-1.0.32-modified-setup.exe
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          old_name = os.environ['OLD_NAME']
          new_name = os.environ['NEW_NAME']
          for name in (old_name, new_name):
              if not re.fullmatch(r'[A-Za-z0-9._-]+\.exe', name):
                  raise ValueError('Expected a plain .exe filename')

          def gh(*args, payload=None):
              result = subprocess.run(
                  ['gh', *args],
                  input=json.dumps(payload) if payload is not None else None,
                  text=True, capture_output=True, check=True
              )
              return result.stdout

          def api(path, payload=None):
              args = ['api', path]
              if payload is not None:
                  args.extend(['--method', 'PATCH', '--input', '-'])
              return json.loads(gh(*args, payload=payload))

          release = api(f'repos/{repo}/releases/tags/{quote(tag, safe="")}')
          assets = {asset['name']: asset for asset in release['assets']}
          pairs = []
          for suffix in ('', '.blockmap'):
              asset = assets.get(old_name + suffix) or assets.get(new_name + suffix)
              if asset is None:
                  raise ValueError('Missing asset ' + old_name + suffix)
              if old_name != new_name and old_name + suffix in assets and new_name + suffix in assets:
                  raise ValueError('Both old and new asset names exist')
              pairs.append((asset, new_name + suffix))

          with tempfile.TemporaryDirectory() as directory:
              gh('release', 'download', tag, '--repo', repo,
                 '--pattern', 'latest.yml', '--dir', directory)
              feed = Path(directory) / 'latest.yml'
              original = feed.read_text()
              if old_name not in original and new_name not in original:
                  raise ValueError('Update metadata does not reference this installer')
              updated = original.replace(old_name, new_name)
              for asset, name in pairs:
                  if asset['name'] != name:
                      renamed = api(f'repos/{repo}/releases/assets/{asset["id"]}', {'name': name})
                      if renamed['size'] != asset['size'] or renamed.get('digest') != asset.get('digest'):
                          raise ValueError('Asset bytes changed during rename')
              if updated != original:
                  feed.write_text(updated)
                  gh('release', 'upload', tag, str(feed), '--repo', repo, '--clobber')
              # Remove the temporary duplicate attached during the web-editor attempt
              # only after confirming its contents match the published update feed.
              temporary = assets.get('latest-updated.yml')
              if temporary:
                  gh('release', 'download', tag, '--repo', repo,
                     '--pattern', 'latest-updated.yml', '--dir', directory)
                  if (Path(directory) / 'latest-updated.yml').read_text() != updated:
                      raise ValueError('Temporary metadata differs; preserving it')
                  gh('api', f'repos/{repo}/releases/assets/{temporary["id"]}', '--method', 'DELETE')

          # Keep the release's existing text and update only references to this filename.
          current = api(f'repos/{repo}/releases/{release["id"]}')
          body = current.get('body') or ''
          if old_name in body:
              api(f'repos/{repo}/releases/{release["id"]}', {'body': body.replace(old_name, new_name)})
          names = {asset['name'] for asset in api(f'repos/{repo}/releases/{release["id"]}')['assets']}
          if not {new_name, new_name + '.blockmap', 'latest.yml'}.issubset(names):
              raise ValueError('Release assets are incomplete')
          print('Renamed installer and blockmap, and updated latest.yml and release links.')
          PY
