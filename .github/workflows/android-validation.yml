name: Android development validation

on:
  workflow_dispatch:
  push:
    branches: ['mobile/android']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts
        working-directory: mobile-host
      - run: pnpm run typecheck:web
      - run: pnpm exec vitest run tests/mobile-queue.test.ts tests/mobile-navigation.test.ts tests/scene-restore-links.test.ts tests/portable-nais-backup.test.ts tests/mobile-runtime.test.ts tests/mobile-tag-search.test.ts tests/mobile-restore-workspace.test.ts tests/native-backup.test.ts tests/mobile-backup-settings.test.ts tests/mobile-touch-height.test.ts tests/prompt-tag-menu.test.ts tests/image-context-menu.test.ts
      - run: pnpm exec vite build --config vite.mobile.config.ts
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
        working-directory: mobile-host
      - run: bash gradlew assembleDebug lintDebug
        working-directory: mobile-host/android
        env:
          NAIS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-validation-reports
          path: mobile-host/android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: nais3-android-development
          path: mobile-host/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
